<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worker reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet" />
<link href="ui.css" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"
  integrity="sha384-WBRt9V/J/erVtkEuP91HUFRv9MvHzFiFOp4/zTDp4xkcMG7aOeIv2asTV4yxFLWa"
  crossorigin="anonymous"></script>
<style>
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .toolbar .spacer { flex: 1; }

  /* A report is a ticket: a coloured rail says what kind of problem it is. */
  .ticket {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 5px;
    border-left: 6px solid var(--ink-soft); padding: 16px 18px; margin-bottom: 12px;
  }
  .ticket.machine { border-left-color: var(--required); }
  .ticket.sop { border-left-color: #6b4fa8; }
  .ticket.understanding { border-left-color: var(--caution); }
  .ticket .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .ticket .said { margin: 0; font-family: Mukta, system-ui, sans-serif; font-size: 19px; line-height: 1.45; }
  .ticket .meta { margin-left: auto; color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ticket .aside {
    margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--rule);
    background: var(--paper); font-family: Mukta, system-ui, sans-serif; font-size: 17px;
  }
  .ticket .aside b { font-family: Archivo, system-ui, sans-serif; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); display: block; }
  .ticket .reply-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }

  .plate.hot { background: var(--stop); border-color: var(--stop); color: #fff; }
  .plate.esc { border-color: var(--stop); color: var(--stop); }

  /* A proposed card change is the one thing that should stop a manager scrolling. */
  .change { border: 2px solid var(--ink); border-radius: 5px; background: var(--surface);
    padding: 18px; margin-bottom: 12px; }
  .change h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .change .was, .change .now {
    font-family: Mukta, system-ui, sans-serif; font-size: 18px; padding: 10px 12px; border-radius: 4px;
  }
  .change .was { background: #fdf2f2; color: #8e1d1d; text-decoration: line-through; }
  .change .now { background: #f0f8f3; color: #12523a; margin-top: 6px; }
  .change .btn.ok { background: var(--safe); border-color: var(--safe); }
  .change .btn.ok:hover { background: #12603a; border-color: #12603a; }
</style>
</head>
<body>
  <div class="wrap wide">
    <a class="back" href="index.html"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Home</a>

    <header class="head">
      <h1>Worker reports</h1>
      <p>What the cards could not answer, in the words of the people running your lines. No
         names are attached, and the recordings are gone.</p>
    </header>

    <div class="toolbar">
      <select id="statusFilter" class="field">
        <option value="">Any status</option>
        <option value="open">Open</option>
        <option value="acknowledged">Acknowledged</option>
        <option value="resolved">Resolved</option>
        <option value="received">Still processing</option>
        <option value="failed">Failed</option>
      </select>
      <select id="kindFilter" class="field">
        <option value="">Any kind</option>
        <option value="machine">Machine fault</option>
        <option value="sop">Card is wrong</option>
        <option value="understanding">Needs training</option>
      </select>
      <span class="spacer"></span>
      <span id="whoami" class="plate hidden"></span>
      <button type="button" id="signOut" class="btn link">Sign out</button>
    </div>

    <div id="errorBox" class="alert hidden"></div>
    <section id="edits"></section>
    <section id="list"></section>
  </div>

<script src="app.js"></script>
<script>
const KIND = { machine: 'Machine fault', sop: 'Card is wrong', understanding: 'Needs training' };
const STATUS = { open: 'Open', acknowledged: 'Acknowledged', resolved: 'Resolved',
                 received: 'Still processing', failed: 'Failed' };

const list = document.getElementById('list');
const edits = document.getElementById('edits');
const whoami = document.getElementById('whoami');
const errorBox = document.getElementById('errorBox');

// Reading reports is for managers and plant heads. Sign-in itself lives on index.html.
const staff = requireRole('manager', 'plant_head');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.remove('hidden');
}

if (staff) {
  whoami.textContent = `${staff.name}, ${staff.role.replace('_', ' ')}`;
  whoami.classList.remove('hidden');
  document.getElementById('signOut').addEventListener('click', signOut);
}

function plate(text, kind) {
  return `<span class="plate${kind ? ' ' + kind : ''}">${text}</span>`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}

function renderReport(r) {
  const card = document.createElement('article');
  card.className = `ticket ${r.kind || ''}`;
  const pending = r.status === 'received' || r.status === 'failed';
  const when = new Date(r.created_at).toLocaleString(undefined,
    { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  card.innerHTML = `
    <div class="top">
      ${r.kind ? plate(KIND[r.kind], 'filled') : ''}
      ${r.severity === 'high' ? plate('Risk of injury', 'hot') : ''}
      ${plate(STATUS[r.status] || r.status)}
      ${r.escalated ? plate('Now with the plant head', 'esc') : ''}
      ${r.cluster_size > 1 ? plate(`${r.confirmed ? 'Confirmed by' : 'Said by'} ${r.cluster_size} workers`, r.confirmed ? 'hot' : '') : ''}
      <span class="meta">${when}, report ${r.id}</span>
    </div>
    <p class="said" dir="auto">${escapeHtml(r.summary || (r.status === 'failed'
      ? `Could not be processed: ${r.error}` : 'Being transcribed and sorted...'))}</p>
    ${r.suggested_change ? `<p class="aside" dir="auto"><b>Suggested card text</b>${escapeHtml(r.suggested_change)}</p>` : ''}
    ${r.response_text ? `<p class="aside" dir="auto"><b>You replied</b>${escapeHtml(r.response_text)}</p>` : ''}
    ${pending ? '' : `
    <div class="reply-row">
      <input class="reply field grow" dir="auto" placeholder="Reply to the worker, spoken back in ${r.language === 'mr' ? 'Marathi' : 'Hindi'}" />
      <select class="status field">
        ${['open', 'acknowledged', 'resolved'].map((s) => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}
      </select>
      <button class="send btn">Send reply</button>
    </div>`}`;

  card.querySelector('.send')?.addEventListener('click', async () => {
    const reply = card.querySelector('.reply').value.trim();
    const body = { status: card.querySelector('.status').value, ...(reply && { response_text: reply }) };
    const res = await fetch(`${API_BASE}/api/report/${r.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify(body),
    });
    if (!res.ok) return showError(`Sending the reply failed: ${await res.text()}`);
    load();
  });
  return card;
}

function renderEdit(e) {
  const card = document.createElement('article');
  card.className = 'change';
  const who = e.report_count === 1 ? 'A worker says' : `${e.report_count} workers say`;
  card.innerHTML = `
    <h2>${who} step ${e.step_number} on machine ${e.machine_id} is wrong</h2>
    <p class="was" dir="auto">${escapeHtml(e.old_text)}</p>
    <p class="now" dir="auto">${escapeHtml(e.new_text)}</p>
    <div class="row tight" style="margin-top:14px">
      <button data-action="approve" class="btn ok">Change the card</button>
      <button data-action="reject" class="btn quiet">Keep it as it is</button>
    </div>`;
  card.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', async () => {
    const res = await fetch(`${API_BASE}/api/step-edit/${e.id}/${btn.dataset.action}`,
                            { method: 'POST', headers: authHeaders() });
    if (!res.ok) return showError(`That did not go through: ${await res.text()}`);
    load();
  }));
  return card;
}

async function load() {
  const params = new URLSearchParams();
  const status = document.getElementById('statusFilter').value;
  const kind = document.getElementById('kindFilter').value;
  if (status) params.set('status', status);
  if (kind) params.set('kind', kind);

  let reports;
  try {
    // apiAuth signs the caller out and returns to index.html on an expired session.
    reports = await apiAuth(`/api/reports?${params}`);
  } catch (err) {
    return showError(`Loading reports failed: ${err.message}`);
  }
  errorBox.classList.add('hidden');
  edits.replaceChildren(...(await apiAuth('/api/step-edits')).map(renderEdit));
  list.replaceChildren(...reports.map(renderReport));
  if (!reports.length) {
    list.innerHTML = '<div class="block empty"><p>Nothing waiting for you.</p>'
      + '<p class="sub">Reports appear here when a worker speaks about something the cards do not cover.</p></div>';
  }
  lucide.createIcons();
}

document.getElementById('statusFilter').addEventListener('change', load);
document.getElementById('kindFilter').addEventListener('change', load);
if (staff) load();
lucide.createIcons();
</script>
</body>
</html>

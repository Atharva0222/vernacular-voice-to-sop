<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Record a procedure</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet" />
<link href="ui.css" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"
  integrity="sha384-WBRt9V/J/erVtkEuP91HUFRv9MvHzFiFOp4/zTDp4xkcMG7aOeIv2asTV4yxFLWa"
  crossorigin="anonymous"></script>
<style>
  .current { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .current li { display: flex; gap: 12px; align-items: flex-start; }
  .current .n {
    flex: 0 0 26px; height: 26px; display: grid; place-items: center; margin-top: 1px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: var(--plate-radius);
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .current .t { font-family: Mukta, system-ui, sans-serif; font-size: 18px; line-height: 1.4; }
  .block h2.with-link a { font-size: 14px; font-weight: 500; text-decoration: none; }
  .block h2.with-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="machines.html?role=supervisor"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Machines</a>

    <header class="head">
      <h1 id="pageTitle">Record a procedure</h1>
      <p>Say the steps out loud, one sentence each, in Hindi or Marathi. They become the cards
         the worker at this machine sees and hears.</p>
      <div class="plates" id="machinePlates"></div>
    </header>

    <section id="currentSop" class="block hidden">
      <h2 class="with-link">
        <span id="currentTitle"></span>
        <a id="viewCards" href="#">Open the worker's cards</a>
      </h2>
      <ol id="currentSteps" class="current"></ol>
      <button id="replaceBtn" class="btn quiet wide" style="margin-top:18px">
        <i data-lucide="mic" style="width:18px;height:18px"></i> Record a new version
      </button>
    </section>

    <section id="recorder" class="block">
      <div class="row" style="margin-bottom:16px">
        <label class="inline" for="lang">Spoken in</label>
        <select id="lang" class="field">
          <option value="auto">Detect the language</option>
          <option value="hi">Hindi</option>
          <option value="mr">Marathi</option>
        </select>
      </div>

      <div class="row">
        <button id="recordBtn" class="btn record">
          <i data-lucide="mic" style="width:18px;height:18px"></i> <span id="recordLabel">Start recording</span>
        </button>
        <span class="inline">or</span>
        <label class="btn quiet" style="cursor:pointer">
          <i data-lucide="upload" style="width:18px;height:18px"></i> Upload a clip
          <input id="fileInput" type="file" accept="audio/*" class="hidden" />
        </label>
        <span id="audioStatus" class="inline"></span>
      </div>

      <button id="generateBtn" class="btn wide" disabled style="margin-top:18px">
        <i data-lucide="wand-2" style="width:18px;height:18px"></i> Make the cards
      </button>

      <p id="pipelineStatus" class="note hidden" style="margin:16px 0 0"></p>
      <p id="errorBox" class="alert hidden" style="margin:16px 0 0"></p>

      <details id="transcriptBox" class="hidden" style="margin-top:16px">
        <summary class="inline" style="cursor:pointer">What was heard <span id="detectedLangBadge" class="plate"></span></summary>
        <p id="transcriptText" dir="auto" style="margin:10px 0 0; font-family:Mukta,system-ui,sans-serif"></p>
      </details>
    </section>
  </div>

<script src="app.js"></script>
<script>
const machineId = param('machine');

let recordedBlob = null;
let mediaRecorder = null;
let chunks = [];
let isRecording = false;

const recorder = document.getElementById('recorder');
const recordBtn = document.getElementById('recordBtn');
const recordLabel = document.getElementById('recordLabel');
const fileInput = document.getElementById('fileInput');
const generateBtn = document.getElementById('generateBtn');
const audioStatus = document.getElementById('audioStatus');
const pipelineStatus = document.getElementById('pipelineStatus');
const errorBox = document.getElementById('errorBox');
const transcriptBox = document.getElementById('transcriptBox');
const transcriptText = document.getElementById('transcriptText');
const detectedLangBadge = document.getElementById('detectedLangBadge');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.remove('hidden');
}
function setStage(msg) {
  pipelineStatus.classList.remove('hidden');
  pipelineStatus.innerHTML = `<span class="dot">●</span> ${msg}`;
}
function setAudio(blob, label) {
  recordedBlob = blob;
  audioStatus.textContent = label;
  generateBtn.disabled = false;
}

recordBtn.addEventListener('click', async () => {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'audio/webm' });
        setAudio(blob, `Recorded ${(blob.size / 1024).toFixed(0)} KB`);
        stream.getTracks().forEach((t) => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      recordLabel.textContent = 'Stop recording';
    } catch (err) {
      showError('The microphone is blocked or unavailable: ' + err.message);
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    recordLabel.textContent = 'Start recording';
  }
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) setAudio(file, file.name);
});

/** Transcribe, structure, save against this machine, then hand over to its cards. */
generateBtn.addEventListener('click', async () => {
  if (!recordedBlob) return;
  errorBox.classList.add('hidden');
  generateBtn.disabled = true;

  try {
    setStage('Listening to the recording...');
    const form = new FormData();
    form.append('audio', recordedBlob, 'clip.webm');
    form.append('language', document.getElementById('lang').value);
    const { transcript, detected_language } = await api('/api/transcribe', { method: 'POST', body: form });

    transcriptText.textContent = transcript;
    detectedLangBadge.textContent = detected_language === 'mr' ? 'Marathi' : 'Hindi';
    transcriptBox.classList.remove('hidden');

    setStage('Splitting it into steps...');
    const { steps } = await api('/api/structure', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript, language: detected_language }),
    });

    setStage(`Saving ${steps.length} cards...`);
    const sop = await api('/api/sop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        machine_id: Number(machineId),
        title: steps[0]?.text.slice(0, 60) || 'SOP',
        language: detected_language,
        transcript,
        steps,
      }),
    });
    location.href = `cards.html?machine=${sop.machine_id}`;
  } catch (err) {
    pipelineStatus.classList.add('hidden');
    showError(err.message);
    generateBtn.disabled = false;
  }
});

function plate(text, kind) {
  const span = document.createElement('span');
  span.className = `plate${kind ? ' ' + kind : ''}`;
  span.textContent = text;
  document.getElementById('machinePlates').appendChild(span);
}

/** A machine that already has cards shows them; recording is then an explicit replacement. */
async function showCurrentSop(machine) {
  const sop = await api(`/api/machine/${machine.id}/sop`);
  document.getElementById('currentTitle').textContent = `Cards now in use, version ${sop.version}`;
  document.getElementById('viewCards').href = `cards.html?machine=${machine.id}`;

  const list = document.getElementById('currentSteps');
  for (const step of sop.steps) {
    const row = document.createElement('li');
    row.innerHTML = '<span class="n"></span><span class="t" dir="auto"></span>';
    row.querySelector('.n').textContent = step.step_number;
    row.querySelector('.t').textContent = step.text;
    list.appendChild(row);
  }

  document.getElementById('currentSop').classList.remove('hidden');
  recorder.classList.add('hidden');
  document.getElementById('replaceBtn').addEventListener('click', () => {
    recorder.classList.remove('hidden');
    recorder.scrollIntoView({ behavior: 'smooth' });
  });
  lucide.createIcons();
}

async function load() {
  if (!machineId) {
    generateBtn.disabled = true;
    return showError('No machine chosen. Go back to the machine list and pick one.');
  }
  const machine = await getMachine(machineId);
  document.getElementById('pageTitle').textContent = machine.name;
  plate(machine.line_name, 'filled');
  plate(machine.sop_id ? `${machine.step_count} cards in use` : 'No cards yet',
        machine.sop_id ? 'safe' : 'caution');

  if (machine.sop_id) await showCurrentSop(machine);
}

load().catch((err) => showError(err.message));

lucide.createIcons();
</script>
</body>
</html>

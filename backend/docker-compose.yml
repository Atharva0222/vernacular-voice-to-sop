services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite inlines these into the frontend bundle at build time (see Dockerfile) - Compose
        # pulls them from this same directory's .env file automatically, same values as
        # V2S_SUPABASE_URL/V2S_SUPABASE_ANON_KEY below, just under the VITE_ prefix.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: voice-to-sop
    env_file: .env
    ports:
      # Loopback-only: nginx is the only thing that should reach this, same as this box's
      # other proxied services. Not exposed directly to the internet.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Whisper-medium (CPU, fp32) can run 2.5-3GB RSS on first use - capped so a spike gets this
    # container OOM-killed and restarted (restart: unless-stopped) rather than starving the
    # host's other services. Raise if this VPS ever gets more RAM.
    mem_limit: 2g
    memswap_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

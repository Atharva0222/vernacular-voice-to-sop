name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        env:
          V2S_AUTH_SECRET: ci-test-secret-not-for-prod
          V2S_LLM_API_KEY: ci-test-key
        run: pytest -q --cov=app --cov-report=term-missing

  # Independent of `test`: the backend tolerates a missing frontend/dist (see main.py), so
  # this isn't a dependency of the pytest run - it's here to catch the frontend breaking on
  # its own.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Manual only: the image's build step downloads the Whisper checkpoints from Hugging
  # Face (see backend/Dockerfile) and any app/ change busts that layer's cache, so running
  # this on every push would re-pull several GB on each run. Trigger it by hand before a
  # deploy, or add `push`/`pull_request` back here if that cost becomes worth paying always.
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t voice-to-sop backend
